<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body { font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #d8d8d8; background: #2d2d2d; margin: 0; }
.row { display: flex; align-items: center; gap: 8px; margin: 8px 16px; }
label { flex: 0 0 100px; text-align: right; color: #b4b4b4; }
input { box-sizing: border-box; flex: 1; min-width: 0; height: 25px; padding: 3px 7px; color: #e8e8e8; background: #3d3d3d; border: 1px solid #1d1d1d; border-radius: 3px; font: inherit; }
input:focus { outline: 1px solid #2681c3; }
input:disabled { opacity: .55; }
#message { margin: 8px 16px 8px 124px; color: #d0d0d0; }
</style>
</head>
<body>
<div class="row">
  <label for="configuration">Configuration</label>
  <input id="configuration" type="text" placeholder="C:\VPN\server.conf" spellcheck="false" disabled>
</div>
<div class="row">
  <label for="exe">AmneziaWG</label>
  <input id="exe" type="text" spellcheck="false" disabled>
</div>
<p id="message" role="status"></p>
<script src="inspector.js"></script>
</body>
</html>
